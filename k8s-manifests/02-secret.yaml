# ==============================================================================
# BƯỚC 3: LƯU TRỮ DỮ LIỆU BẢO MẬT & NHẠY CẢM (SECRET)
# ==============================================================================
# TẠI SAO PHẢI CÓ FILE NÀY MÀ KHÔNG ĐỂ CHUNG VÀO CONFIGMAP?
# - ConfigMap lưu dạng chữ thường (Plaintext), bất kỳ ai có quyền xem pod đều đọc được.
# - Secret dùng riêng cho: Mật khẩu Database, API Token, Private Key SSL, Chuỗi mã hóa.
# - Dữ liệu trong Secret được mã hóa dạng Base64.
#   (Ví dụ: Chuỗi "SuperSecretPass123" được mã hóa thành "U3VwZXJTZWNyZXRQYXNzMTIz")
# - Khi nhúng vào Container, Kubernetes sẽ tự động giải mã ngược lại thành văn bản gốc
#   để ứng dụng đọc được mà không lo bị lộ mật khẩu khi ai đó nhìn lướt qua file cấu hình.
# ==============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: quiz-secret
  namespace: quiz-app          # BẮT BUỘC: Cùng namespace với ứng dụng
type: Opaque
data:
  # Cách tạo chuỗi Base64 trên PowerShell:
  # [Convert]::ToBase64String([System.Text.Encoding]::UTF8.GetBytes("SuperSecretPass123"))
  DB_PASSWORD: U3VwZXJTZWNyZXRQYXNzMTIz
  JWT_SECRET: cXVpei1hcHAtand0LXNlY3JldC1rZXktMjAyNg==
